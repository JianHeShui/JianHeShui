<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tech stack — Languages: TypeScript, Python, Java, C. Frontend: React, Vite, Tailwind CSS. Tools: Git, Docker, Linux, Neovim.">
  <title>Tech stack</title>
  <style>
    svg {
      --bg-0:#05060A; --bg-1:#0B101C;
      --glass-fill:rgba(255,255,255,0.055); --glass-fill-2:rgba(255,255,255,0.085);
      --glass-stroke:rgba(255,255,255,0.16); --glass-hl:rgba(255,255,255,0.55);
      --ink-0:#F7F9FC; --ink-1:#A8B4C8; --ink-2:#6B7A91;
      --accent-a:#7DD3FC; --accent-b:#A78BFA; --accent-c:#F0ABFC;
      --glow-op:0.20;
    }
    @media (prefers-color-scheme: light) {
      svg {
        --bg-0:#F2F5FA; --bg-1:#FFFFFF;
        --glass-fill:rgba(255,255,255,0.62); --glass-fill-2:rgba(255,255,255,0.82);
        --glass-stroke:rgba(15,23,42,0.10); --glass-hl:rgba(255,255,255,0.95);
        --ink-0:#0B1220; --ink-1:#46536B; --ink-2:#7A879C;
        --accent-a:#0EA5E9; --accent-b:#8B5CF6; --accent-c:#D946EF;
        --glow-op:0.13;
      }
    }

    .ink0 { fill: var(--ink-0); }
    .ink1 { fill: var(--ink-1); }
    .ink2 { fill: var(--ink-2); }
    .glass { fill: var(--glass-fill); stroke: var(--glass-stroke); stroke-width: 1; }
    .disp-a { fill: none; stroke: var(--accent-a); stroke-opacity: 0.28; stroke-width: 1; }
    .disp-c { fill: none; stroke: var(--accent-c); stroke-opacity: 0.22; stroke-width: 1; }
    .pill { fill: var(--glass-fill-2); stroke: var(--glass-stroke); stroke-width: 1; }
    .leader { stroke: var(--glass-stroke); stroke-width: 1; stroke-opacity: 0.9; stroke-dasharray: 1 6; stroke-linecap: round; }

    .sect {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 13px; font-weight: 700; letter-spacing: 1.8px;
    }
    .mono-lbl {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 13px; font-weight: 500; letter-spacing: 1.5px;
    }
    .chip-t {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px; font-weight: 500; letter-spacing: 0.1px;
    }

    .glow-a { opacity: 1; }
    .glow-b { opacity: 0.85; }
    @media (prefers-color-scheme: light) {
      .glow-a { opacity: 0.5; }
      .glow-b { opacity: 0.42; }
    }

    /* 入场只做位移，不做透明度：静态渲染（无动画）下内容始终完整可见 */
    @keyframes rowIn {
      from { transform: translateY(8px); }
      to   { transform: translateY(0); }
    }
    .row { animation: rowIn 0.9s cubic-bezier(.22,1,.36,1) forwards; }
    .row1 { animation-delay: 0.10s; }
    .row2 { animation-delay: 0.20s; }
    .row3 { animation-delay: 0.30s; }
    .fade { animation: rowIn 0.9s cubic-bezier(.22,1,.36,1) forwards; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>

  <defs>
    <filter id="stack-shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="stack-hl" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="stack-glow-inner">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stack-glow-a">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stack-glow-b">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="stack-card-clip">
      <rect x="40" y="40" width="1120" height="220" rx="26"/>
    </clipPath>
    <clipPath id="stack-top-half">
      <rect x="40" y="40" width="1120" height="110"/>
    </clipPath>
    <clipPath id="stack-bot-half">
      <rect x="40" y="150" width="1120" height="110"/>
    </clipPath>
  </defs>

  <!-- ① 投影 + ② 玻璃面 -->
  <g filter="url(#stack-shadow)">
    <rect class="glass" x="40" y="40" width="1120" height="220" rx="26"/>
  </g>

  <!-- ③ 顶部高光 / ④ 内部柔光 / ⑥ 角落光斑（裁在圆角内） -->
  <g clip-path="url(#stack-card-clip)">
    <rect x="40" y="40" width="1120" height="1.2" fill="url(#stack-hl)"/>
    <circle cx="150" cy="74" r="230" fill="url(#stack-glow-inner)"/>
    <circle cx="1050" cy="150" r="290" class="glow-a" fill="url(#stack-glow-a)"/>
    <circle cx="820" cy="262" r="240" class="glow-b" fill="url(#stack-glow-b)"/>
  </g>

  <!-- ⑤ 伪色散边缘 -->
  <rect x="40" y="39.3" width="1120" height="220" rx="26" class="disp-a" clip-path="url(#stack-top-half)"/>
  <rect x="40" y="40.7" width="1120" height="220" rx="26" class="disp-c" clip-path="url(#stack-bot-half)"/>

  <!-- 左上角区块标题 -->
  <text class="sect ink2 fade" x="100" y="74">TECH STACK</text>

  <!-- LANGUAGES -->
  <g class="row row1">
    <text class="mono-lbl ink2" x="100" y="116">LANGUAGES</text>
    <line class="leader" x1="190" y1="111" x2="744" y2="111"/>
    <rect class="pill" x="760" y="94" width="110" height="34" rx="17"/>
    <text class="chip-t ink0" x="815" y="116" text-anchor="middle">TypeScript</text>
    <rect class="pill" x="880" y="94" width="84" height="34" rx="17"/>
    <text class="chip-t ink0" x="922" y="116" text-anchor="middle">Python</text>
    <rect class="pill" x="974" y="94" width="68" height="34" rx="17"/>
    <text class="chip-t ink0" x="1008" y="116" text-anchor="middle">Java</text>
    <rect class="pill" x="1052" y="94" width="48" height="34" rx="17"/>
    <text class="chip-t ink0" x="1076" y="116" text-anchor="middle">C</text>
  </g>

  <!-- FRONTEND -->
  <g class="row row2">
    <text class="mono-lbl ink2" x="100" y="170">FRONTEND</text>
    <line class="leader" x1="181" y1="165" x2="796" y2="165"/>
    <rect class="pill" x="812" y="148" width="76" height="34" rx="17"/>
    <text class="chip-t ink0" x="850" y="170" text-anchor="middle">React</text>
    <rect class="pill" x="898" y="148" width="66" height="34" rx="17"/>
    <text class="chip-t ink0" x="931" y="170" text-anchor="middle">Vite</text>
    <rect class="pill" x="974" y="148" width="126" height="34" rx="17"/>
    <text class="chip-t ink0" x="1037" y="170" text-anchor="middle">Tailwind CSS</text>
  </g>

  <!-- TOOLS -->
  <g class="row row3">
    <text class="mono-lbl ink2" x="100" y="224">TOOLS</text>
    <line class="leader" x1="156" y1="219" x2="744" y2="219"/>
    <rect class="pill" x="760" y="202" width="58" height="34" rx="17"/>
    <text class="chip-t ink0" x="789" y="224" text-anchor="middle">Git</text>
    <rect class="pill" x="828" y="202" width="86" height="34" rx="17"/>
    <text class="chip-t ink0" x="871" y="224" text-anchor="middle">Docker</text>
    <rect class="pill" x="924" y="202" width="74" height="34" rx="17"/>
    <text class="chip-t ink0" x="961" y="224" text-anchor="middle">Linux</text>
    <rect class="pill" x="1008" y="202" width="92" height="34" rx="17"/>
    <text class="chip-t ink0" x="1054" y="224" text-anchor="middle">Neovim</text>
  </g>
</svg>
