<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="JianHeShui — 把想法做成能用的东西">
  <title>JianHeShui · 把想法做成能用的东西</title>

  <!--
    ============================================================================
    hero.svg / JianHeShui GitHub 主页封面主视觉
    规格：viewBox 0 0 1200 380 / 液态玻璃 / 双主题 / 零外部依赖
    ============================================================================
    【头像替换说明】
    当前徽标为单色字母 J（矢量，零依赖）。若要替换为真实头像：
      1) 头像压成 256x256 的 PNG，转成 base64；
      2) 把下方 J 字形那行换成一个 image 元素（注意不能写成裸标签，否则会被
         GitHub 的图片白名单剥掉），需要的属性是：
         x=70 y=126 width=128 height=128
         clip-path="url(#hero-avatarClip)" preserveAspectRatio="xMidYMid slice"
         href="data:image/png;base64,BASE64字符串"
      3) 只能用 data URI。不要引用外部链接：SVG 以 img 方式加载时外部资源一律不加载。
    ============================================================================
  -->

  <style>
    :root {
      --glass-fill:rgba(255,255,255,0.055);
      --glass-fill-2:rgba(255,255,255,0.085);
      --glass-stroke:rgba(255,255,255,0.16);
      --glass-hl:rgba(255,255,255,0.55);
      --ink-0:#F7F9FC;
      --ink-1:#A8B4C8;
      --ink-2:#6B7A91;
      --accent-a:#7DD3FC;
      --accent-b:#A78BFA;
      --accent-c:#F0ABFC;
      --live:#4ADE80;
      --glow-op:0.20;
      --orb-fill:rgba(255,255,255,0.085);
      --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Roboto, Helvetica, Arial, sans-serif;
      --mono:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --glass-fill:rgba(255,255,255,0.62);
        --glass-fill-2:rgba(255,255,255,0.82);
        --glass-stroke:rgba(15,23,42,0.14);
        --glass-hl:rgba(255,255,255,0.95);
        --ink-0:#0B1220;
        --ink-1:#46536B;
        --ink-2:#7A879C;
        --accent-a:#0EA5E9;
        --accent-b:#8B5CF6;
        --accent-c:#D946EF;
        --live:#10B981;
        --glow-op:0.13;
        /* 亮色下玻璃圆盘的实白会显得比卡片还亮（像贴纸），压到 0.42 让它融进卡面 */
        --orb-fill:rgba(255,255,255,0.42);
      }
    }

    /* 双主题元素切换（DESIGN.md §5：唯一允许的换色方式） */
    .only-dark  { display: inline; }
    .only-light { display: none; }
    @media (prefers-color-scheme: light) {
      .only-dark  { display: none; }
      .only-light { display: inline; }
    }

    /* 字体栈（属性里用单引号包字体名） */
    .sans { font-family: var(--sans); }
    .mono { font-family: var(--mono); }

    /* 颜色一律走 class，禁止在 presentation attribute 里写 var() */
    .ink0 { fill: var(--ink-0); }
    .ink1 { fill: var(--ink-1); }
    .ink2 { fill: var(--ink-2); }
    .accent { fill: var(--accent-a); }
    .dot-live { fill: var(--live); }

    /* 玻璃 */
    .glass { fill: var(--glass-fill); stroke: var(--glass-stroke); stroke-width:1; }
    .pill  { fill: var(--glass-fill-2); stroke: var(--glass-stroke); stroke-width:1; }

    /* 徽标圆环 */
    .orb { fill: var(--orb-fill); stroke: var(--glass-stroke); stroke-width:1; }
    .orb-outer { fill:none; stroke: var(--glass-stroke); stroke-width:0.8; opacity:0.55; }
    .orb-arc { fill:none; stroke: var(--glass-hl); stroke-width:1.2; opacity:0.40; }
    .orb-inner { fill:none; stroke: var(--glass-hl); stroke-width:0.7; opacity:0.26; }

    /* 文字排版（DESIGN.md §3.3） */
    .title      { font-size:72px; font-weight:800; letter-spacing:-1.6px; }
    .tagline    { font-size:23px; font-weight:450; letter-spacing:0.3px; }
    .pill-label { font-size:13px; font-weight:700; letter-spacing:1.8px; }
    .meta       { font-size:16px; font-weight:400; letter-spacing:0.1px; }
    .mono-letter{ font-size:72px; font-weight:800; letter-spacing:0; }

    /* 高光 / 装饰条 */
    .hl-top { opacity:0.55; }
    @media (prefers-color-scheme: light) { .hl-top { opacity:0.9; } }

    /* 背景光斑整体强度 */
    .glow-layer { opacity: var(--glow-op); }

    /* ------------------------------------------------------------------
       动效（DESIGN.md §6）：光斑漂移 22s、卡片入场 0.9s、高光扫过 7s
       ------------------------------------------------------------------ */
    @keyframes hero-drift {
      from { transform: translate(0px, 0px); }
      to   { transform: translate(14px, -10px); }
    }
    .drift { animation: hero-drift 22s ease-in-out infinite alternate; }

    @keyframes hero-enter {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0px); }
    }
    .enter { animation: hero-enter 0.9s cubic-bezier(.22,1,.36,1) both; }

    @keyframes hero-sheen {
      0%   { transform: translateX(-520px); opacity: 0; }
      15%  { opacity: 0.14; }
      80%  { opacity: 0.14; }
      100% { transform: translateX(1400px); opacity: 0; }
    }
    .sheen { opacity: 0; animation: hero-sheen 7s linear 2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>

  <defs>
    <!-- ================= 背景（双主题） ================= -->
    <!-- 背景底色贴近 GitHub 暗色页面底 canvas.default #0d1117，避免图片边缘出现硬色差矩形。
         DESIGN.md 的 bg-0 / bg-1 token 仍是 #05060A / #0B101C（保留在 :root 中），
         此处按集成时的实际页面底色做了接缝对齐。 -->
    <linearGradient id="hero-bgD" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#0B1017"/>
      <stop offset="0.52" stop-color="#0D1117"/>
      <stop offset="1"    stop-color="#10151F"/>
    </linearGradient>
    <linearGradient id="hero-bgL" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#F2F5FA"/>
      <stop offset="0.55" stop-color="#F8FAFD"/>
      <stop offset="1"    stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- ================= 彩色光斑：暗色 ================= -->
    <radialGradient id="hero-blueD">
      <stop offset="0"    stop-color="#7DD3FC" stop-opacity="0.95"/>
      <stop offset="0.38" stop-color="#7DD3FC" stop-opacity="0.40"/>
      <stop offset="1"    stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-purpleD">
      <stop offset="0"    stop-color="#A78BFA" stop-opacity="0.95"/>
      <stop offset="0.40" stop-color="#A78BFA" stop-opacity="0.36"/>
      <stop offset="1"    stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-pinkD">
      <stop offset="0"    stop-color="#F0ABFC" stop-opacity="0.90"/>
      <stop offset="0.40" stop-color="#F0ABFC" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>

    <!-- ================= 彩色光斑：亮色 ================= -->
    <radialGradient id="hero-blueL">
      <stop offset="0"    stop-color="#0EA5E9" stop-opacity="0.85"/>
      <stop offset="0.40" stop-color="#0EA5E9" stop-opacity="0.32"/>
      <stop offset="1"    stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-purpleL">
      <stop offset="0"    stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="0.40" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-pinkL">
      <stop offset="0"    stop-color="#D946EF" stop-opacity="0.80"/>
      <stop offset="0.40" stop-color="#D946EF" stop-opacity="0.24"/>
      <stop offset="1"    stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>

    <!-- ================= 徽标字母 J 的渐变 ================= -->
    <linearGradient id="hero-jD" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="hero-jL" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- ================= 伪色散边缘 ================= -->
    <linearGradient id="hero-dispTopD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#7DD3FC" stop-opacity="0.46"/>
      <stop offset="0.52" stop-color="#A78BFA" stop-opacity="0.32"/>
      <stop offset="0.86" stop-color="#A78BFA" stop-opacity="0.19"/>
      <stop offset="1"    stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-dispTopL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#0EA5E9" stop-opacity="0.38"/>
      <stop offset="0.52" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="0.86" stop-color="#8B5CF6" stop-opacity="0.13"/>
      <stop offset="1"    stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <!-- 底部折射：两端（左右下拐角）亮，中间归零，避免贯穿全宽的"漏光" -->
    <linearGradient id="hero-dispBotD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#F0ABFC" stop-opacity="0.26"/>
      <stop offset="0.10" stop-color="#F0ABFC" stop-opacity="0.10"/>
      <stop offset="0.30" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.90" stop-color="#A78BFA" stop-opacity="0.09"/>
      <stop offset="1"    stop-color="#A78BFA" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="hero-dispBotL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#D946EF" stop-opacity="0.22"/>
      <stop offset="0.10" stop-color="#D946EF" stop-opacity="0.08"/>
      <stop offset="0.30" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.90" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="1"    stop-color="#8B5CF6" stop-opacity="0.20"/>
    </linearGradient>

    <!-- ================= 圆环内柔光 ================= -->
    <radialGradient id="hero-orbD" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#A78BFA" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#7DD3FC" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-orbL" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0"    stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <!-- ================= 通用光影（两主题共用） ================= -->
    <radialGradient id="hero-innerGlow">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-frost" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.085"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.022"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 亮色专用：斜向冷白渐变，把卡片从白色页面底上"抬"起一层 -->
    <linearGradient id="hero-frostL" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.42" stop-color="#F4F7FF" stop-opacity="0.20"/>
      <stop offset="0.72" stop-color="#EDF1FE" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#E8EDFB" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="hero-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ================= 投影：只输出阴影（源图形被丢弃） ================= -->
    <filter id="hero-castShadow" x="-25%" y="-25%" width="150%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="hero-blur"/>
      <feOffset in="hero-blur" dx="0" dy="18" result="hero-offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.45"/>
      <feComposite in2="hero-offset" operator="in" result="hero-shadow"/>
      <feMerge>
        <feMergeNode in="hero-shadow"/>
      </feMerge>
    </filter>

    <!-- ================= 裁剪 ================= -->
    <clipPath id="hero-cardClip">
      <rect x="40" y="40" width="1120" height="300" rx="26"/>
    </clipPath>
    <clipPath id="hero-avatarClip">
      <circle cx="134" cy="190" r="64"/>
    </clipPath>
    <!-- 徽标圆环的上半圈高光：只保留上半弧形 -->
    <clipPath id="hero-orbTopClip">
      <rect x="58" y="112" width="152" height="78"/>
    </clipPath>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect class="only-dark"  x="0" y="0" width="1200" height="380" fill="url(#hero-bgD)"/>
  <rect class="only-light" x="0" y="0" width="1200" height="380" fill="url(#hero-bgL)"/>

  <!-- ================= 背景彩色光斑（22s 缓慢漂移） ================= -->
  <g class="glow-layer drift">
    <g class="only-dark">
      <circle cx="170" cy="90"  r="420" fill="url(#hero-blueD)"/>
      <circle cx="1040" cy="340" r="400" fill="url(#hero-purpleD)" opacity="0.8"/>
      <circle cx="760" cy="20"  r="300" fill="url(#hero-pinkD)" opacity="0.55"/>
    </g>
    <g class="only-light">
      <circle cx="170" cy="90"  r="420" fill="url(#hero-blueL)" opacity="0.9"/>
      <circle cx="1040" cy="340" r="400" fill="url(#hero-purpleL)" opacity="0.5"/>
      <circle cx="760" cy="20"  r="300" fill="url(#hero-pinkL)" opacity="0.38"/>
    </g>
  </g>

  <!-- ================= 卡片（入场动画包住全部图层） ================= -->
  <g class="enter">

    <!-- ① 投影 -->
    <rect x="40" y="40" width="1120" height="300" rx="26" fill="#000000" filter="url(#hero-castShadow)"/>

    <!-- ② 玻璃面 -->
    <rect class="glass" x="40" y="40" width="1120" height="300" rx="26"/>

    <g clip-path="url(#hero-cardClip)">
      <!-- 磨砂质感层：左上到右下的极淡白渐变 -->
      <rect x="40" y="40" width="1120" height="300" fill="url(#hero-frost)"/>

      <!-- ④ 内部柔光：左上角一团低透明度径向白 -->
      <circle cx="250" cy="70" r="300" fill="url(#hero-innerGlow)"/>
      <!-- 亮色补充：斜向冷白层，增强"离页面"的层次 -->
      <rect class="only-light" x="40" y="40" width="1120" height="300" fill="url(#hero-frostL)"/>

      <!-- ⑥ 角落光斑 + ⑤ 伪色散边缘 -->
      <g class="only-dark">
        <circle cx="100"  cy="40"  r="320" fill="url(#hero-blueD)"   opacity="0.62"/>
        <circle cx="1150" cy="350" r="380" fill="url(#hero-pinkD)"   opacity="0.55"/>
        <rect x="40" y="42.4" width="1120" height="2.6" fill="url(#hero-dispTopD)"/>
        <rect x="40" y="338.4" width="1120" height="1.6" fill="url(#hero-dispBotD)"/>
      </g>
      <g class="only-light">
        <circle cx="100"  cy="40"  r="320" fill="url(#hero-blueL)"   opacity="0.24"/>
        <circle cx="1150" cy="350" r="380" fill="url(#hero-pinkL)"   opacity="0.12"/>
        <rect x="40" y="42.4" width="1120" height="2.6" fill="url(#hero-dispTopL)"/>
        <rect x="40" y="338.4" width="1120" height="1.6" fill="url(#hero-dispBotL)"/>
      </g>

      <!-- ③ 顶部高光：紧贴顶边的 1.6px 白线，两端淡出 -->
      <rect x="40" y="40.3" width="1120" height="1.6" fill="url(#hero-hl)" class="hl-top"/>
    </g>

    <!-- ================= 左侧徽标（玻璃圆环 + 单色 J） ================= -->
    <g>
      <circle class="orb-outer" cx="134" cy="190" r="74"/>
      <circle class="orb"       cx="134" cy="190" r="66"/>
      <g class="only-dark">
        <circle cx="134" cy="190" r="66" fill="url(#hero-orbD)"/>
      </g>
      <g class="only-light">
        <circle cx="134" cy="190" r="66" fill="url(#hero-orbL)"/>
      </g>
      <circle class="orb-arc"   cx="134" cy="190" r="65.4" clip-path="url(#hero-orbTopClip)"/>
      <circle class="orb-inner" cx="134" cy="190" r="56"/>
      <g class="only-dark">
        <text class="sans mono-letter" x="134" y="216" text-anchor="middle" fill="url(#hero-jD)">J</text>
      </g>
      <g class="only-light">
        <text class="sans mono-letter" x="134" y="216" text-anchor="middle" fill="url(#hero-jL)">J</text>
      </g>
      <!-- 轨道装饰点 -->
      <circle class="dot-live" cx="181" cy="143" r="3" opacity="0.55"/>
    </g>

    <!-- ================= 右侧信息区（左对齐 x=330） ================= -->
    <g>
      <!-- 第一行：3 个玻璃胶囊 chip -->
      <rect class="pill" x="330" y="90" width="308" height="30" rx="15"/>
      <circle class="dot-live" cx="346" cy="105" r="3"/>
      <circle class="dot-live" cx="346" cy="105" r="6" opacity="0.22"/>
      <text class="sans pill-label ink2" x="358" y="109.5">AVAILABLE FOR COLLABORATION</text>

      <rect class="pill" x="648" y="90" width="154" height="30" rx="15"/>
      <text class="sans pill-label ink2" x="662" y="109.5">CDTU · STUDENT</text>

      <rect class="pill" x="812" y="90" width="136" height="30" rx="15"/>
      <text class="sans pill-label ink2" x="826" y="109.5">CHENGDU, CN</text>

      <!-- 第二行：名字（视觉焦点）。右侧原设计的渐变竖线已移除：
           不同平台字体宽度不同，装饰线会压住字形，改用下方 tagline 前的留白承担节奏 -->
      <text class="sans title ink0" x="330" y="194">JianHeShui</text>

      <!-- 第三行：tagline -->
      <text class="sans tagline ink1" x="330" y="246">把想法做成能用的东西 · Building things that actually work</text>

      <!-- 第四行：项目一行（等宽字体） -->
      <text class="mono meta ink2" x="330" y="286">campus-auth · cdtu-campus-network · wechat-stats <tspan class="accent">→</tspan></text>
    </g>

    <!-- ⑤ 高光扫过：倾斜 20deg 的白色光带，7s 从左侧扫到右侧 -->
    <g clip-path="url(#hero-cardClip)">
      <g class="sheen">
        <path d="M 200 0 L 380 0 L 518 380 L 338 380 Z" fill="url(#hero-sheenGrad)"/>
      </g>
    </g>

  </g>
</svg>
